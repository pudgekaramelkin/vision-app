name: Apply verified production upgrade
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply prepared patch
        run: |
          echo "bf0748e228fe4d58cd51a970f3fc946158dbf33440dae30c0b508e6d88c9944a  vision-upgrade.patch" | sha256sum -c -
          git switch -c codex/production-upgrade
          git apply --check vision-upgrade.patch
          git apply vision-upgrade.patch
          rm vision-upgrade.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade vision app for public production"
          git push origin HEAD:codex/production-upgrade
